<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Satyam Kumar Portfolio{% endblock %}</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="navbar navbar-expand-lg fixed-top bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary" href="{{ url_for('home') }}">Satyam Kumar</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-end" id="nav">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="{{ url_for('home') }}#home">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('home') }}#about">About</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('home') }}#skills">Skills</a></li>
                <li class="nav-item"><a class="nav-link {% if active == 'projects' %}active{% endif %}" href="{{ url_for('projects') }}">Projects</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('home') }}#contact">Contact</a></li>
            </ul>
        </div>
    </div>
</nav>

{% block content %}{% endblock %}

<footer class="bg-dark text-white text-center py-3">
    <p class="mb-0">© 2026 Satyam Kumar</p>
</footer>

<div class="modal fade" id="projectModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header border-0">
                <span class="badge bg-primary-subtle text-primary" id="modalCategory"></span>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body pt-0">
                <img id="modalImage" src="" alt="" class="w-100 rounded mb-3 modal-img">
                <h4 id="modalTitle" class="fw-bold mb-2"></h4>
                <p id="modalDescription" class="text-muted"></p>
                <a id="modalLink" href="#" target="_blank" class="btn btn-primary">
                    View Project <i class="fas fa-arrow-up-right-from-square ms-1"></i>
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
